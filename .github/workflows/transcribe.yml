name: תמלול דיסקים

on:
  push:
    paths: ["queue.txt", ".github/workflows/transcribe.yml", "scripts/**"]
  workflow_dispatch:

concurrency:
  group: transcribe
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  transcribe:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: התקנה
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
          pip install -q faster-whisper gdown

      - uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-ivrit-turbo-ct2

      - name: הגדרת git
        run: |
          git config user.name "rav-arie-bot"
          git config user.email "actions@github.com"

      - name: הורדה ותמלול לפי התור
        run: |
          # כל שורה בתור: <folder_id>|<שם הדיסק>
          grep -v '^\s*#' queue.txt | grep '|' | while IFS='|' read -r FID NAME; do
            FID=$(echo "$FID" | xargs); NAME=$(echo "$NAME" | xargs)
            if [ -f "transcripts/$NAME/.done" ]; then echo "✓ $NAME כבר הושלם"; continue; fi
            echo "::group::$NAME"
            mkdir -p "audio/$NAME"
            gdown --folder "https://drive.google.com/drive/folders/$FID" -O "audio/$NAME"
            # gdown עשוי ליצור תת-תיקייה; מאחדים את כל ה-mp3 לתיקיית הדיסק
            find "audio/$NAME" -mindepth 2 -iname '*.mp3' -exec mv -n {} "audio/$NAME/" \;
            ls -la "audio/$NAME"
            python scripts/transcribe.py "audio/$NAME" --out transcripts --commit < /dev/null
            touch "transcripts/$NAME/.done"
            git add "transcripts/$NAME/.done"
            git commit -m "הושלם: $NAME" || true
            git pull --rebase -q || true
            git push -q || true
            echo "::endgroup::"
          done
