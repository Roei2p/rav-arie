name: חיתוך שמע לקליפים

on:
  push:
    paths: ["clips/*.json", "scripts/cut_audio.py", ".github/workflows/clips.yml"]
  workflow_dispatch:

concurrency:
  group: clips
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  cut:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: התקנה
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
          pip install -q gdown
      - name: חיתוך
        run: python scripts/cut_audio.py
      - name: שמירה בריפו
        run: |
          git config user.name "rav-arie-bot"; git config user.email "actions@github.com"
          git add web/cuts
          git commit -m "שמע לקליפים" || true
          for i in 1 2 3 4 5 6 7 8; do git pull --rebase -q && git push -q && break; sleep $((RANDOM % 15 + 5)); done
